<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Page not found — NEURL-OS</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0C0F">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/consent.js"></script>
<style>
:root{--bg:#0A0C0F;--surf:#14181D;--hair:#232830;--fg:#fff;--soft:#D7DCE3;--muted:#8B93A1;--green:#38EE66;--ink:#06210F;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.bar{position:fixed;inset:0 0 auto;height:4px;background:var(--green)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 0}
.box{max-width:420px;width:100%;display:flex;flex-direction:column;gap:16px}
.brand{color:var(--fg);text-decoration:none;font-weight:700;font-size:18px;letter-spacing:.02em}
.code{font-size:12px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
h1{margin:0;font-size:28px;line-height:1.2;text-wrap:balance}
p{margin:0;color:var(--soft)}
.btn{display:block;text-align:center;background:var(--green);color:var(--ink);font-weight:700;text-decoration:none;padding:15px;border-radius:14px}
.alt{color:var(--muted);text-align:center;font-size:14px}
.alt a{color:var(--muted)}
a:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:4px}
</style>
</head>
<body>
<div class="bar"></div>
<main>
  <div class="box">
    <a class="brand" href="/">NEURL-OS</a>
    <div class="code">Error 404</div>
    <h1>This page doesn’t exist.</h1>
    <p>The link may be old or mistyped. Your results are safe on your device.</p>
    <a class="btn" href="/">Go to today’s test</a>
    <p class="alt">Came from a gym or team poster? Scan the code again, or <a href="/contact.html">contact us</a>.</p>
  </div>
</main>
</body>
</html>
